services:
  - type: web
    name: clearclause-backend
    runtime: python
    repo: Kushagra524/Clear-Clause
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FLASK_HOST
        value: 0.0.0.0
      - key: FLASK_PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: HF_API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: "https://your-vercel-app.vercel.app"
